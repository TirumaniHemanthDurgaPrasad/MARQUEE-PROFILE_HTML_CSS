<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 400px;
            width: 500px;
            display: grid;
             grid-template-columns: 1fr 2fr 1fr;
            grid-template-columns: 1fr 2fr 1fr;
            border: 1px solid black;
            gap: 10px;
        }
        .item1{
            height: 50px;
            width: 50px;
            align-self:start;
            border: 1px solid black;
            background-color: aqua;
        }
          .item2{
            height: 50px;
            width: 50px;
            justify-self: center;
            align-self:end;
            border: 1px solid black;
            background-color: aqua;
        }
           .item3{
            height: 50px;
            width: 50px;
            justify-self: end;
            align-self:start;
            border: 1px solid black;
            background-color: aqua;
        }
          .item4{
            height: 50px;
            width: 50px;
            justify-self: center;
            align-self:center;
            border: 1px solid black;
            background-color: aqua;
        }
          .item5{
            height: 50px;
            width: 50px;
            justify-self: center;
            align-self:center;
            border: 1px solid black;
            background-color: aqua;
        }
          .item6{
            height: 50px;
            width: 50px;
            justify-self: center;
            align-self:center;
            border: 1px solid black;
            background-color: aqua;
        }
          .item7{
            height: 50px;
            width: 50px;
         
            align-self:end;
            border: 1px solid black;
            background-color: aqua;
        }
          .item8{
            height: 50px;
            width: 50px;
            justify-self: center;
            align-self:start;
            border: 1px solid black;
            background-color: aqua;
        }
              .item9{
            height: 50px;
            width: 50px;
            justify-self: end;
            align-self:end;
            border: 1px solid black;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
         <div class="item2"></div>
          <div class="item3"></div>
           <div class="item4"></div>
            <div class="item5"></div>
             <div class="item6"></div>
              <div class="item7"></div>
               <div class="item8"></div>
                <div class="item9"></div>
    </div>
</body>
</html>
